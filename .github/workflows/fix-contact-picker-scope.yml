name: Fix LibraryDialog scope

on:
  push:
    branches:
      - refactor/student-card-v47

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/student-card-v47

      - name: Fix LibraryDialog scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER_modularized.kt')
          s = path.read_text(encoding='utf-8')
          old = '''    val visible = items.filter { search.isBlank() || it.name.contains(search,true) || it.category.contains(search,true) }'''
          new = '''    var search by remember { mutableStateOf(\"\") }\n    val context = LocalContext.current\n\n    val visible = items.filter { search.isBlank() || it.name.contains(search, true) || it.category.contains(search, true) }'''
          if old not in s:
              raise SystemExit('Expected LibraryDialog visible line not found')
          s = s.replace(old, new, 1)
          path.write_text(s, encoding='utf-8')
          print('LibraryDialog search and context declarations added.')
          PY

      - name: Commit source fix and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER_modularized.kt
          git rm -f .github/workflows/fix-contact-picker-scope.yml .github/workflows/fix-library-dialog-scope.yml 2>/dev/null || true
          git commit -m 'Fix LibraryDialog search and context scope'
          git push origin HEAD:refactor/student-card-v47
