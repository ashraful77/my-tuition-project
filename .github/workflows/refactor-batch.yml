name: Extract Batch And Routine

on:
  push:
    branches:
      - refactor/student-card-v47
  workflow_dispatch:

jobs:
  extract-batch:
    if: github.actor == 'ashraful77'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/student-card-v47

      - name: Extract Batch and Routine feature
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          src = Path('app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER_modularized.kt')
          out = Path('app/src/main/java/com/themathguild/mytuitionmanager/batch/BatchManager.kt')
          text = src.read_text()

          names = ['BatchManagerDialog', 'TodayWorkDialog', 'FullScreenPage', 'LiveBatchDialog']
          extracted = {}

          def extract_function(s, name):
              matches = list(re.finditer(r'(?m)^@Composable\\s+(?:private\\s+)?fun\\s+' + re.escape(name) + r'\\b', s))
              if len(matches) != 1:
                  raise SystemExit(f'{name}: expected exactly 1 declaration, found {len(matches)}')
              start = matches[0].start()
              brace = s.find('{', matches[0].end())
              if brace < 0:
                  raise SystemExit(f'{name}: opening brace not found')
              depth = 0
              in_string = False
              escape = False
              line_comment = False
              block_comment = False
              i = brace
              while i < len(s):
                  c = s[i]
                  n = s[i + 1] if i + 1 < len(s) else ''
                  if line_comment:
                      if c == '\\n': line_comment = False
                  elif block_comment:
                      if c == '*' and n == '/': block_comment = False; i += 1
                  elif in_string:
                      if escape: escape = False
                      elif c == '\\': escape = True
                      elif c == '"': in_string = False
                  else:
                      if c == '/' and n == '/': line_comment = True; i += 1
                      elif c == '/' and n == '*': block_comment = True; i += 1
                      elif c == '"': in_string = True
                      elif c == '{': depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              return start, i + 1
                  i += 1
              raise SystemExit(f'{name}: unmatched braces')

          # FullScreenPage is part of this feature and must not be shared elsewhere.
          if len(re.findall(r'(?m)\\bFullScreenPage\\s*\\(', text)) != 1:
              raise SystemExit('FullScreenPage is referenced more than once; aborting safely')

          for name in names:
              a, b = extract_function(text, name)
              extracted[name] = text[a:b]

          # Remove from bottom to top so offsets remain valid.
          ranges = sorted((extract_function(text, n) for n in names), reverse=True)
          for a, b in ranges:
              text = text[:a] + text[b:]

          import_line = 'import com.themathguild.mytuitionmanager.batch.BatchManager\\n'
          if import_line not in text:
              marker = 'package com.themathguild.mytuitionmanager\\n'
              if marker not in text:
                  raise SystemExit('package marker not found')
              text = text.replace(marker, marker + '\\n' + import_line, 1)

          header = '''package com.themathguild.mytuitionmanager.batch

          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import com.themathguild.mytuitionmanager.BatchNote
          import com.themathguild.mytuitionmanager.Batch
          import com.themathguild.mytuitionmanager.BatchRoutine
          import com.themathguild.mytuitionmanager.currentDate
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          '''
          # LocalContext/KeyboardOptions are intentionally omitted by cleanup below if unused.
          body = '\\n\\n'.join(extracted[n] for n in ['BatchManagerDialog', 'FullScreenPage', 'LiveBatchDialog', 'TodayWorkDialog'])
          new_content = header + body + '\\n'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(new_content)

          # Remove imports that are genuinely unused; keep the file simple.
          lines = out.read_text().splitlines()
          used = out.read_text()
          cleaned = []
          for line in lines:
              if line.startswith('import ') and line.split('.')[-1] in {'KeyboardOptions', 'LocalContext'}:
                  continue
              cleaned.append(line)
          out.write_text('\\n'.join(cleaned) + '\\n')
          src.write_text(text)

          for name in names:
              if re.search(r'(?m)^@Composable\\s+(?:private\\s+)?fun\\s+' + re.escape(name) + r'\\b', text):
                  raise SystemExit(f'{name} still present in MainActivity')
          print('Batch/Routine extraction completed successfully.')
          PY

      - name: Verify extraction
        run: |
          test -f app/src/main/java/com/themathguild/mytuitionmanager/batch/BatchManager.kt
          grep -q 'import com.themathguild.mytuitionmanager.batch.BatchManager' app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER_modularized.kt
          grep -q 'fun BatchManagerDialog' app/src/main/java/com/themathguild/mytuitionmanager/batch/BatchManager.kt
          grep -q 'fun LiveBatchDialog' app/src/main/java/com/themathguild/mytuitionmanager/batch/BatchManager.kt
          grep -q 'fun TodayWorkDialog' app/src/main/java/com/themathguild/mytuitionmanager/batch/BatchManager.kt
          grep -q 'fun FullScreenPage' app/src/main/java/com/themathguild/mytuitionmanager/batch/BatchManager.kt
          ! grep -q '^@Composable.*fun BatchManagerDialog' app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER_modularized.kt

      - name: Commit extraction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER_modularized.kt app/src/main/java/com/themathguild/mytuitionmanager/batch/BatchManager.kt
          git commit -m 'Refactor: extract Batch and Routine management'
          git push origin HEAD:refactor/student-card-v47

      - name: Remove temporary workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refactor-batch.yml
          git commit -m 'chore: remove temporary batch refactor workflow'
          git push origin HEAD:refactor/student-card-v47
