name: Build My Tuition Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - refactor/student-card-v47

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          ref: refactor/student-card-v47

      - name: Extract green features
        shell: python
        run: |
          from pathlib import Path
          import re

          src = Path('app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER_modularized.kt')
          text = src.read_text(encoding='utf-8')

          targets = {
              'ReportsDialog': 'app/src/main/java/com/themathguild/mytuitionmanager/reports/ReportsDialog.kt',
              'BatchManagerDialog': 'app/src/main/java/com/themathguild/mytuitionmanager/batches/BatchManagerDialog.kt',
              'LiveBatchDialog': 'app/src/main/java/com/themathguild/mytuitionmanager/batches/LiveBatchDialog.kt',
              'TodayWorkDialog': 'app/src/main/java/com/themathguild/mytuitionmanager/batches/TodayWorkDialog.kt',
              'ReceiptHistoryDialog': 'app/src/main/java/com/themathguild/mytuitionmanager/receipts/ReceiptHistoryDialog.kt',
              'StudentEditorDialog': 'app/src/main/java/com/themathguild/mytuitionmanager/students/StudentEditorDialog.kt',
              'StudentDetailsDialog': 'app/src/main/java/com/themathguild/mytuitionmanager/students/StudentDetailsDialog.kt',
          }

          def extract(source, name):
              m = re.search(r'(?m)^(?:@Composable\s*\n)?fun\s+' + re.escape(name) + r'\s*\(', source)
              if not m:
                  raise RuntimeError(f'Missing target: {name}')
              start = m.start()
              brace = source.find('{', m.end())
              if brace < 0:
                  raise RuntimeError(f'No opening brace: {name}')
              depth = 0
              i = brace
              state = 'normal'
              while i < len(source):
                  c = source[i]
                  n = source[i+1] if i + 1 < len(source) else ''
                  if state == 'normal':
                      if c == '"':
                          if source[i:i+3] == '"""': state = 'triple'; i += 3; continue
                          state = 'string'; i += 1; continue
                      if c == '/' and n == '/': state = 'line'; i += 2; continue
                      if c == '/' and n == '*': state = 'block'; i += 2; continue
                      if c == '{': depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0: return start, i + 1
                      i += 1
                  elif state == 'string':
                      if c == '\\': i += 2; continue
                      if c == '"': state = 'normal'
                      i += 1
                  elif state == 'triple':
                      if source[i:i+3] == '"""': state = 'normal'; i += 3
                      else: i += 1
                  elif state == 'line':
                      if c == '\n': state = 'normal'
                      i += 1
                  else:
                      if c == '*' and n == '/': state = 'normal'; i += 2
                      else: i += 1
              raise RuntimeError(f'Unclosed target: {name}')

          header = '''package com.themathguild.mytuitionmanager

import android.net.Uri
import androidx.compose.foundation.*
import androidx.compose.foundation.layout.*
import androidx.compose.foundation.lazy.*
import androidx.compose.foundation.rememberScrollState
import androidx.compose.foundation.verticalScroll
import androidx.compose.foundation.horizontalScroll
import androidx.compose.foundation.text.KeyboardOptions
import androidx.compose.material3.*
import androidx.compose.runtime.*
import androidx.compose.ui.*
import androidx.compose.ui.Alignment
import androidx.compose.ui.Modifier
import androidx.compose.ui.platform.LocalContext
import androidx.compose.ui.text.font.FontWeight
import androidx.compose.ui.text.input.KeyboardType
import androidx.compose.ui.unit.dp
import com.themathguild.mytuitionmanager.receipts.*
import java.text.SimpleDateFormat
import java.time.LocalDate
import java.time.YearMonth
import java.time.format.DateTimeFormatter
import java.util.*

'''

          spans = []
          for name, out in targets.items():
              a, b = extract(text, name)
              body = text[a:b].strip() + '\n'
              p = Path(out)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(header + body, encoding='utf-8')
              spans.append((a, b, name))

          for a, b, name in sorted(spans, reverse=True):
              text = text[:a] + text[b:]

          text = text.replace('private fun recentMonths(', 'fun recentMonths(')
          text = text.replace('private fun FullScreenPage(', 'fun FullScreenPage(')
          src.write_text(text, encoding='utf-8')
          print('Extracted:', ', '.join(targets))

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > mytuition-release.jks
          ls -lh mytuition-release.jks

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Commit extracted source and restore workflow
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/refactor/student-card-v47' && !contains(github.event.head_commit.message, 'Extract green features') }}
        run: |
          git checkout -- .github/workflows/build-apk.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/themathguild/mytuitionmanager .github/workflows/build-apk.yml
          git commit -m "Extract green features into focused files"
          git push origin HEAD:refactor/student-card-v47

      - name: Zipalign APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/zipalign -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks mytuition-release.jks \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out MyTuitionManager-release.apk \
            app-release-aligned.apk

      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose MyTuitionManager-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTuitionManager-Signed-APK
          path: MyTuitionManager-release.apk
