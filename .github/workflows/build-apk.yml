name: Build My Tuition Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------
      # CHECKOUT
      # -------------------------------------------------

      - name: Checkout project
        uses: actions/checkout@v4


      # -------------------------------------------------
      # JAVA 17
      # -------------------------------------------------

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # -------------------------------------------------
      # GRADLE 8.9
      # -------------------------------------------------

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'


      # -------------------------------------------------
      # ANDROID SDK
      # -------------------------------------------------

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"


      # -------------------------------------------------
      # PREPARE SIGNING KEYSTORE
      # -------------------------------------------------

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > mytuition-release.jks

          echo "Keystore created successfully."

          ls -lh mytuition-release.jks


      # -------------------------------------------------
      # BUILD RELEASE APK
      # -------------------------------------------------

      - name: Build release APK
        run: |
          gradle :app:assembleRelease --no-daemon


      # -------------------------------------------------
      # ALIGN APK
      # -------------------------------------------------

      - name: Zipalign APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/zipalign \
            -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app-release-aligned.apk


      # -------------------------------------------------
      # SIGN APK
      # -------------------------------------------------

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks mytuition-release.jks \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out MyTuitionManager-release.apk \
            app-release-aligned.apk


      # -------------------------------------------------
      # VERIFY SIGNATURE
      # -------------------------------------------------

      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify \
            --verbose \
            MyTuitionManager-release.apk


      # -------------------------------------------------
      # UPLOAD APK
      # -------------------------------------------------

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTuitionManager-Signed-APK
          path: MyTuitionManager-release.apk
