name: Apply bottom navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Update MainActivity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase20_v30_APP_LOGO.kt')
          s = p.read_text()
          if 'var selectedBottomTab by remember' in s:
              raise SystemExit(0)
          marker = '    var receiptUri by remember { mutableStateOf<Uri?>(null) }\n'
          if marker not in s:
              raise SystemExit('state marker not found')
          s = s.replace(marker, marker + '    var selectedBottomTab by remember { mutableStateOf(0) }\n', 1)
          actions = '                    actions = { IconButton(onClick = { settingsOpen = true }) { Text("⚙", style = MaterialTheme.typography.titleLarge) } }\n'
          if actions not in s:
              raise SystemExit('settings action not found')
          s = s.replace(actions, '', 1)
          end = '            }\n        ) { padding ->\n'
          nav = '''            },
            bottomBar = {
                NavigationBar {
                    NavigationBarItem(selected = selectedBottomTab == 0, onClick = { selectedBottomTab = 0 }, icon = { Text("⌂") }, label = { Text("Home") })
                    NavigationBarItem(selected = selectedBottomTab == 1, onClick = { selectedBottomTab = 1; manageStudentsOpen = true }, icon = { Text("☷") }, label = { Text("Students") })
                    NavigationBarItem(selected = selectedBottomTab == 2, onClick = { selectedBottomTab = 2; receiptHistoryOpen = true }, icon = { Text("₹") }, label = { Text("Payments") })
                    NavigationBarItem(selected = selectedBottomTab == 3, onClick = { selectedBottomTab = 3; reportOpen = true }, icon = { Text("▥") }, label = { Text("Reports") })
                    NavigationBarItem(selected = selectedBottomTab == 4, onClick = { selectedBottomTab = 4; settingsOpen = true }, icon = { Text("⚙") }, label = { Text("Settings") })
                }
            }
        ) { padding ->
'''
          if end not in s:
              raise SystemExit('scaffold marker not found')
          s = s.replace(end, nav, 1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase20_v30_APP_LOGO.kt
          git commit -m "Move Settings to bottom navigation"
          git push origin HEAD:main
