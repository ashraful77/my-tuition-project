name: Apply bottom navigation
on: [push]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch MainActivity
        shell: bash
        run: |
          FILE=app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase20_v30_APP_LOGO.kt
          grep -q 'var selectedBottomTab by remember' "$FILE" && exit 0
          sed -i '/var receiptUri by remember/a\    var selectedBottomTab by remember { mutableStateOf(0) }' "$FILE"
          sed -i '/actions = { IconButton(onClick = { settingsOpen = true })/d' "$FILE"
          python3 -c 'from pathlib import Path; p=Path("app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase20_v30_APP_LOGO.kt"); s=p.read_text(); old="            }\n        ) { padding ->\n"; nav="            },\n            bottomBar = {\n                NavigationBar {\n                    NavigationBarItem(selected = selectedBottomTab == 0, onClick = { selectedBottomTab = 0 }, icon = { Text(\"⌂\") }, label = { Text(\"Home\") })\n                    NavigationBarItem(selected = selectedBottomTab == 1, onClick = { selectedBottomTab = 1; manageStudentsOpen = true }, icon = { Text(\"☷\") }, label = { Text(\"Students\") })\n                    NavigationBarItem(selected = selectedBottomTab == 2, onClick = { selectedBottomTab = 2; receiptHistoryOpen = true }, icon = { Text(\"₹\") }, label = { Text(\"Payments\") })\n                    NavigationBarItem(selected = selectedBottomTab == 3, onClick = { selectedBottomTab = 3; reportOpen = true }, icon = { Text(\"▥\") }, label = { Text(\"Reports\") })\n                    NavigationBarItem(selected = selectedBottomTab == 4, onClick = { selectedBottomTab = 4; settingsOpen = true }, icon = { Text(\"⚙\") }, label = { Text(\"Settings\") })\n                }\n            }\n        ) { padding ->\n"; assert old in s, "Scaffold marker not found"; p.write_text(s.replace(old,nav,1))'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git diff --cached --quiet && exit 0
          git commit -m "Move Settings to bottom navigation"
          git push
