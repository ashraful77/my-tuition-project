name: Fix Batch UI Wiring

on:
  push:
    branches:
      - refactor/student-card-v47

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'ashraful77'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove stale embedded BatchManagerDialog
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER_modularized.kt')
          text = path.read_text(encoding='utf-8')

          # The old BatchManagerDialog is embedded in MainActivity. Remove only
          # that function, leaving LibraryDialog and all following code intact.
          pattern = r'\n@Composable\nfun BatchManagerDialog\(.*?\n}\n\n@Composable\nfun LibraryDialog\('
          updated, count = re.subn(pattern, '\n\n@Composable\nfun LibraryDialog(', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected exactly one stale BatchManagerDialog block, found {count}')

          import_line = 'import com.themathguild.mytuitionmanager.batch.BatchManagerDialog'
          if import_line not in updated:
              anchor = 'import com.themathguild.mytuitionmanager.academic.AcademicRecordsDialog\n'
              if anchor not in updated:
                  raise SystemExit('Import anchor not found')
              updated = updated.replace(anchor, anchor + import_line + '\n', 1)

          path.write_text(updated, encoding='utf-8')

      - name: Verify wiring
        run: |
          grep -q 'import com.themathguild.mytuitionmanager.batch.BatchManagerDialog' app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER_modularized.kt
          ! grep -q '^fun BatchManagerDialog(' app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER_modularized.kt

      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER_modularized.kt
          git rm .github/workflows/fix-batch-ui.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Wire Batch routine screen to updated manager'
          git push
