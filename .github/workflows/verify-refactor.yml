name: Verify Refactor Build

on:
  push:
    branches:
      - refactor/student-card-v47
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Gradle project files
        run: |
          ls -la
          find . -maxdepth 3 -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
