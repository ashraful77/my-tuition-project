name: Implement Daily Spent

on:
  push:
    branches:
      - refactor/student-card-v47

permissions:
  contents: write

jobs:
  implement:
    if: github.actor == 'ashraful77'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/student-card-v47
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply Daily Spent integration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          root = Path('app/src/main/java/com/themathguild/mytuitionmanager')
          store = root / 'data/LocalStore.kt'
          main = root / 'MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER_modularized.kt'
          s = store.read_text()
          if 'import com.themathguild.mytuitionmanager.DailySpent' not in s:
              s = s.replace('import com.themathguild.mytuitionmanager.TuitionProfile\n', 'import com.themathguild.mytuitionmanager.TuitionProfile\nimport com.themathguild.mytuitionmanager.DailySpent\n', 1)
          methods = '''\n    fun loadDailySpent(): List<DailySpent> {\n        val a = JSONArray(prefs.getString("dailySpent", "[]"))\n        return List(a.length()) { i ->\n            val o = a.getJSONObject(i)\n            DailySpent(o.getLong("id"), o.optString("date"), o.optString("description"), o.optInt("amount", 0))\n        }\n    }\n\n    fun saveDailySpent(list: List<DailySpent>) {\n        val a = JSONArray()\n        list.forEach { item ->\n            a.put(JSONObject().apply {\n                put("id", item.id)\n                put("date", item.date)\n                put("description", item.description)\n                put("amount", item.amount)\n            })\n        }\n        prefs.edit().putString("dailySpent", a.toString()).apply()\n    }\n'''
          if 'fun loadDailySpent()' not in s:
              marker = '    fun themeMode(): String ='
              if marker not in s: raise SystemExit('LocalStore insertion marker not found')
              s = s.replace(marker, methods + '\n' + marker, 1)
          store.write_text(s)

          m = main.read_text()
          if 'import com.themathguild.mytuitionmanager.dailyspent.DailySpentScreen' not in m:
              m = m.replace('import com.themathguild.mytuitionmanager.components.StudentCard\n', 'import com.themathguild.mytuitionmanager.components.StudentCard\nimport com.themathguild.mytuitionmanager.dailyspent.DailySpentScreen\n', 1)
          m = m.replace('private const val BACKUP_FORMAT_VERSION = 7', 'private const val BACKUP_FORMAT_VERSION = 8', 1)
          old = '    val academic = obj.optJSONArray("academicRecords") ?: JSONArray()\n\n    val studentIds = mutableSetOf<Long>()'
          new = '    val academic = obj.optJSONArray("academicRecords") ?: JSONArray()\n    val dailySpent = obj.optJSONArray("dailySpent") ?: JSONArray()\n\n    val studentIds = mutableSetOf<Long>()'
          if old in m and 'val dailySpent = obj.optJSONArray("dailySpent")' not in m[:m.find('fun exportBackup')]: m = m.replace(old, new, 1)
          marker = '    return null\n}\n\nfun exportBackup(context: Context): Uri {'
          validation = '''    for (i in 0 until dailySpent.length()) {\n        val d = dailySpent.optJSONObject(i) ?: return "Invalid daily spent record."\n        if (!d.has("id") || !d.has("date") || !d.has("description") || !d.has("amount")) return "Invalid daily spent record."\n        if (d.optString("date").isBlank() || d.optString("description").isBlank() || d.optInt("amount", -1) <= 0) return "Invalid daily spent record."\n    }\n    return null\n}\n\nfun exportBackup(context: Context): Uri {'''
          if marker in m and 'Invalid daily spent record.' not in m: m = m.replace(marker, validation, 1)
          old = '    val library = JSONArray(prefs.getString("library", "[]") ?: "[]")\n\n    val json = JSONObject().apply {'
          new = '    val library = JSONArray(prefs.getString("library", "[]") ?: "[]")\n    val dailySpent = JSONArray(prefs.getString("dailySpent", "[]") ?: "[]")\n\n    val json = JSONObject().apply {'
          if old in m and 'val dailySpent = JSONArray(prefs.getString("dailySpent"' not in m: m = m.replace(old, new, 1)
          old = '        put("library", library)\n        put("tuitionProfile", profile)'
          new = '        put("library", library)\n        put("dailySpent", dailySpent)\n        put("dailySpentCount", dailySpent.length())\n        put("tuitionProfile", profile)'
          if old in m and 'put("dailySpent", dailySpent)' not in m: m = m.replace(old, new, 1)
          old = '        val library = obj.optJSONArray("library") ?: JSONArray()\n\n        if (validateBackupData(obj) != null) return false'
          new = '        val library = obj.optJSONArray("library") ?: JSONArray()\n        val dailySpent = obj.optJSONArray("dailySpent") ?: JSONArray()\n\n        if (validateBackupData(obj) != null) return false'
          import_start = m.find('fun importBackup')
          if old in m[import_start:] and '.putString("dailySpent", dailySpent.toString())' not in m: m = m.replace(old, new, 1)
          old = '            .putString("library", library.toString())\n\n        obj.optJSONObject("tuitionProfile")?.let'
          new = '            .putString("library", library.toString())\n            .putString("dailySpent", dailySpent.toString())\n\n        obj.optJSONObject("tuitionProfile")?.let'
          if old in m and '.putString("dailySpent", dailySpent.toString())' not in m: m = m.replace(old, new, 1)
          old = '    var payments by remember { mutableStateOf(store.loadPayments()) }\n    var attendance by remember { mutableStateOf(store.loadAttendance()) }'
          new = '    var payments by remember { mutableStateOf(store.loadPayments()) }\n    var dailySpent by remember { mutableStateOf(store.loadDailySpent()) }\n    var attendance by remember { mutableStateOf(store.loadAttendance()) }'
          if old in m and 'var dailySpent by remember' not in m: m = m.replace(old, new, 1)
          old = '                                payments = store.loadPayments()\n                                attendance = store.loadAttendance()'
          new = '                                payments = store.loadPayments()\n                                dailySpent = store.loadDailySpent()\n                                attendance = store.loadAttendance()'
          if old in m and 'dailySpent = store.loadDailySpent()' not in m: m = m.replace(old, new, 1)
          old = '                    NavigationBarItem(selected = selectedBottomTab == 3, onClick = { navigateToTab(3) }, icon = { Text("₹") }, label = { Text("Payments") })\n                    NavigationBarItem(selected = selectedBottomTab == 4, onClick = { navigateToTab(4) }, icon = { Text("⚙") }, label = { Text("Settings") })'
          new = '                    NavigationBarItem(selected = selectedBottomTab == 3, onClick = { navigateToTab(3) }, icon = { Text("₹") }, label = { Text("Payments") })\n                    NavigationBarItem(selected = selectedBottomTab == 4, onClick = { navigateToTab(4) }, icon = { Text("🧾") }, label = { Text("Daily Spent") })\n                    NavigationBarItem(selected = selectedBottomTab == 5, onClick = { navigateToTab(5) }, icon = { Text("⚙") }, label = { Text("Settings") })'
          if old not in m: raise SystemExit('Bottom navigation marker not found')
          m = m.replace(old, new, 1)
          if 'if (selectedBottomTab == 4) SettingsDialog(' not in m: raise SystemExit('Settings tab marker not found')
          m = m.replace('if (selectedBottomTab == 4) SettingsDialog(', 'if (selectedBottomTab == 5) SettingsDialog(', 1)
          marker = '        if (selectedBottomTab == 5) SettingsDialog('
          screen = '''        if (selectedBottomTab == 4) DailySpentScreen(\n            expenses = dailySpent,\n            onAdd = { description, amount ->\n                guarded("dailySpent", "Add Daily Spent") {\n                    dailySpent = dailySpent + DailySpent(System.currentTimeMillis(), currentDate(), description, amount)\n                    store.saveDailySpent(dailySpent)\n                }\n            },\n            onEdit = { expense, description, amount ->\n                guarded("dailySpent", "Edit Daily Spent") {\n                    dailySpent = dailySpent.map { if (it.id == expense.id) it.copy(description = description, amount = amount) else it }\n                    store.saveDailySpent(dailySpent)\n                }\n            },\n            onDelete = { expense ->\n                guarded("dailySpent", "Delete Daily Spent") {\n                    dailySpent = dailySpent.filterNot { it.id == expense.id }\n                    store.saveDailySpent(dailySpent)\n                }\n            }\n        )\n\n'''
          if marker in m and 'if (selectedBottomTab == 4) DailySpentScreen' not in m: m = m.replace(marker, screen + marker, 1)
          old = '"demo" to "Demo / Test Data","restore" to "Restore Backup"'
          new = '"demo" to "Demo / Test Data","restore" to "Restore Backup","dailySpent" to "Daily Spent"'
          if old in m: m = m.replace(old, new, 1)
          main.write_text(m)
          PY
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Commit Daily Spent integration
        run: |
          git status --short
          git add app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER_modularized.kt app/src/main/java/com/themathguild/mytuitionmanager/data/LocalStore.kt
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --no-verify -m 'feat: add date-wise Daily Spent tab [skip ci]'
          git push origin HEAD:refactor/student-card-v47
