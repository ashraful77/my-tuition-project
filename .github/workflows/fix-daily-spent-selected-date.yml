name: Fix Daily Spent Selected Date

on:
  push:
    branches:
      - refactor/student-card-v47

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'ashraful77'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/student-card-v47

      - name: Wire selected date into Daily Spent add
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('app/src/main/java/com/themathguild/mytuitionmanager')
          screen = root / 'dailyspent/DailySpent.kt'
          main = root / 'MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER_modularized.kt'

          s = screen.read_text(encoding='utf-8')
          old_sig = '    onAdd: (String, Int) -> Unit,\n'
          new_sig = '    onAdd: (String, Int, String) -> Unit,\n'
          if s.count(old_sig) != 1:
              raise SystemExit('DailySpent onAdd signature marker not found exactly once')
          s = s.replace(old_sig, new_sig, 1)

          old_add = 'DailySpentEditorDialog("Add Expense", null, dateText, { addOpen = false }) { description, amount -> onAdd(description, amount); addOpen = false }'
          new_add = 'DailySpentEditorDialog("Add Expense", null, dateText, { addOpen = false }) { description, amount -> onAdd(description, amount, dateText); addOpen = false }'
          if s.count(old_add) != 1:
              raise SystemExit('DailySpent add callback marker not found exactly once')
          s = s.replace(old_add, new_add, 1)
          screen.write_text(s, encoding='utf-8')

          m = main.read_text(encoding='utf-8')
          old_lambda = '            onAdd = { description, amount ->\n'
          new_lambda = '            onAdd = { description, amount, date ->\n'
          if m.count(old_lambda) != 1:
              raise SystemExit('Main onAdd lambda marker not found exactly once')
          m = m.replace(old_lambda, new_lambda, 1)

          old_constructor = 'DailySpent(System.currentTimeMillis(), currentDate(), description, amount)'
          new_constructor = 'DailySpent(System.currentTimeMillis(), date, description, amount)'
          if m.count(old_constructor) != 1:
              raise SystemExit('DailySpent constructor marker not found exactly once')
          m = m.replace(old_constructor, new_constructor, 1)
          main.write_text(m, encoding='utf-8')
          print('Daily Spent add now stores the selected date.')

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/fix-daily-spent-selected-date.yml

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/themathguild/mytuitionmanager/dailyspent/DailySpent.kt app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER_modularized.kt .github/workflows/fix-daily-spent-selected-date.yml
          git commit -m 'Store Daily Spent under selected date'
          git push origin HEAD:refactor/student-card-v47
