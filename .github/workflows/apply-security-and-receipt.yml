name: Legacy security and receipt workflow
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  legacy:
    if: github.event.head_commit.message != 'Legacy security and receipt workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify current source layout
        shell: bash
        run: |
          set -e
          SOURCE="app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER.kt"
          test -f "$SOURCE"
          echo "Current source found: $SOURCE"
          echo "Legacy patch workflow is intentionally non-mutating; current source changes are applied directly."
