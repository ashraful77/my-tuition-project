name: Finalize generated Kotlin source
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  finalize:
    if: github.event.head_commit.message != 'Finalize generated Kotlin source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify current source layout
        shell: bash
        run: |
          set -e
          SOURCE="app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER.kt"
          test -f "$SOURCE"
          echo "Current source found: $SOURCE"
          echo "No legacy source normalization is required."
