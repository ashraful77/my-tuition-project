name: Finalize generated Kotlin source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    if: github.event.head_commit.message != 'Finalize generated Kotlin source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Normalize source
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase20_v30_APP_LOGO.kt')
          s = p.read_text()
          marker = chr(92) + 'n'
          count = s.count(marker)
          if count:
              s = s.replace(marker, chr(10))
              p.write_text(s)
          print(f'Normalized {count} literal backslash-n sequences.')
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase20_v30_APP_LOGO.kt
          git diff --cached --quiet && exit 0
          git commit -m "Finalize generated Kotlin source"
          git push origin HEAD:main
