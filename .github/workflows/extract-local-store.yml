name: Extract LocalStore

on:
  push:
    branches:
      - refactor/student-card-v47

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/student-card-v47
          fetch-depth: 0

      - name: Extract LocalStore
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER_modularized.kt")
          text = path.read_text(encoding="utf-8")

          start_marker = "class LocalStore(context: Context) {"
          end_marker = "\n}\n\nprivate val monthFormatter"
          if start_marker not in text:
              raise SystemExit("LocalStore start marker not found")
          start = text.index(start_marker)
          end = text.index(end_marker, start) + 2
          block = text[start:end]

          if "fun loadStudents()" not in block or "fun savePayments" not in block:
              raise SystemExit("LocalStore validation failed")

          models = ["Student", "Payment", "AttendanceRecord", "AcademicRecord", "BatchRoutine", "Batch", "LibraryItem", "BatchNote", "TuitionProfile"]
          imports = "\n".join(f"import com.themathguild.mytuitionmanager.{name}" for name in models)
          local_store = "package com.themathguild.mytuitionmanager.data\n\nimport android.content.Context\nimport org.json.JSONArray\nimport org.json.JSONObject\n" + imports + "\n\n" + block + "\n"

          out = Path("app/src/main/java/com/themathguild/mytuitionmanager/data/LocalStore.kt")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(local_store, encoding="utf-8")

          text = text[:start] + text[end:]
          import_line = "import com.themathguild.mytuitionmanager.data.LocalStore"
          if import_line not in text:
              package_line = "package com.themathguild.mytuitionmanager\n"
              text = text.replace(package_line, package_line + "\n" + import_line + "\n", 1)
          path.write_text(text, encoding="utf-8")

          if "class LocalStore(context: Context)" in text:
              raise SystemExit("LocalStore was not removed from MainActivity")
          if "class LocalStore(context: Context)" not in local_store:
              raise SystemExit("LocalStore was not written")

          print(f"Extracted LocalStore: {len(local_store.encode('utf-8'))} bytes")
          print(f"MainActivity: {len(text.encode('utf-8'))} bytes")

      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/extract-local-store.yml
          git add app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER_modularized.kt app/src/main/java/com/themathguild/mytuitionmanager/data/LocalStore.kt .github/workflows/extract-local-store.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Refactor: extract LocalStore data access"
          git push origin HEAD:refactor/student-card-v47
