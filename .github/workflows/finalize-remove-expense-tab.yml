name: Finalize Expense Tab Removal

on:
  push:
    branches:
      - refactor/student-card-v47

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'ashraful77'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/student-card-v47

      - name: Finalize source safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER_modularized.kt')
          s = p.read_text(encoding='utf-8')

          # Restore the protected-actions list after the earlier overly-broad text replacement.
          bad = '"restore" to \"Restore Backup\",\"dailySpent\" to)'
          good = '"restore" to \"Restore Backup\")'
          s = s.replace(bad, good, 1)

          # Remove the Daily Spent navigation item completely.
          nav = '                    NavigationBarItem(selected = selectedBottomTab == 4, onClick = { navigateToTab(4) }, icon = { Text("🧾") }, label = { Text() })\n'
          if nav not in s:
              raise SystemExit('Expected Expense/Daily Spent navigation item not found')
          s = s.replace(nav, '', 1)

          # Remove the complete Daily Spent screen block.
          start = '        if (selectedBottomTab == 4) DailySpentScreen('
          pos = s.find(start)
          if pos < 0:
              raise SystemExit('DailySpentScreen block not found')
          # Find the next Settings block; everything between them is the Daily Spent screen.
          settings = '        if (selectedBottomTab == 5) SettingsDialog('
          end = s.find(settings, pos)
          if end < 0:
              raise SystemExit('SettingsDialog block not found after DailySpentScreen')
          s = s[:pos] + s[end:]

          # Settings becomes the fourth remaining destination (0..4).
          s = s.replace('if (selectedBottomTab == 5) SettingsDialog(', 'if (selectedBottomTab == 4) SettingsDialog(', 1)
          s = s.replace('onDismiss = { selectedBottomTab = 0 },\n            onAdd = { selectedBottomTab = 0; guarded("addStudent", "Add Student") { addOpen = true } },', 'onDismiss = { selectedBottomTab = 0 },\n            onAdd = { selectedBottomTab = 0; guarded("addStudent", "Add Student") { addOpen = true } },', 1)

          # Remove the now-unused DailySpent import if still present.
          s = s.replace('import com.themathguild.mytuitionmanager.dailyspent.DailySpentScreen\n', '')

          p.write_text(s, encoding='utf-8')
          print('Expense/Daily Spent tab and screen removed; DailySpent data/storage preserved.')
          PY

      - name: Commit and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER_modularized.kt
          git rm -f .github/workflows/finalize-remove-expense-tab.yml
          git commit -m 'Finalize removal of Expense tab'
          git push origin refactor/student-card-v47
