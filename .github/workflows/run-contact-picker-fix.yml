name: Run contact picker build fix

on:
  push:
    branches:
      - refactor/student-card-v47

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'ashraful77'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/student-card-v47

      - name: Move launcher below phone state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER_modularized.kt')
          text = path.read_text(encoding='utf-8')

          launcher = '''    val context = LocalContext.current
    val phonePickerLauncher = androidx.activity.compose.rememberLauncherForActivityResult(
        contract = ActivityResultContracts.StartActivityForResult()
    ) { result ->
        if (result.resultCode == android.app.Activity.RESULT_OK) {
            val uri = result.data?.data
            if (uri != null) {
                context.contentResolver.query(
                    uri,
                    arrayOf(android.provider.ContactsContract.CommonDataKinds.Phone.NUMBER),
                    null,
                    null,
                    null
                )?.use { cursor ->
                    if (cursor.moveToFirst()) {
                        val numberIndex = cursor.getColumnIndex(android.provider.ContactsContract.CommonDataKinds.Phone.NUMBER)
                        if (numberIndex >= 0) phone = cursor.getString(numberIndex) ?: ""
                    }
                }
            }
        }
    }

'''

          if launcher not in text:
              raise SystemExit('Original contact picker launcher not found')
          text = text.replace(launcher, '', 1)

          marker = '    var phone by remember { mutableStateOf(initialStudent?.phone ?: "") }'
          pos = text.find(marker)
          if pos < 0:
              raise SystemExit('Phone state declaration not found')
          insert_at = pos + len(marker)
          text = text[:insert_at] + '\n\n' + launcher + text[insert_at:]
          path.write_text(text, encoding='utf-8')
          print('Contact picker launcher moved after phone state declaration.')
          PY

      - name: Commit source fix and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER_modularized.kt
          git commit -m 'Fix contact picker phone state scope'
          git push origin refactor/student-card-v47

          git rm -f .github/workflows/run-contact-picker-fix.yml .github/workflows/fix-contact-picker-build.yml .github/workflows/fix-contact-picker-scope.yml .github/contact-fix-trigger.txt 2>/dev/null || true
          git commit -m 'Remove temporary contact picker fix workflows' || true
          git push origin refactor/student-card-v47 || true
