name: Run contact picker build fix

on:
  push:
    branches:
      - refactor/student-card-v47

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'ashraful77'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/student-card-v47

      - name: Move launcher below phone state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER_modularized.kt')
          text = path.read_text(encoding='utf-8')

          pattern = r'    val context = LocalContext\.current\n    val phonePickerLauncher = .*?\n    }\n\n(?=    val standardClasses)'
          match = re.search(pattern, text, re.S)
          if not match:
              raise SystemExit('Contact picker launcher block not found')
          launcher = match.group(0)
          text = text[:match.start()] + text[match.end():]

          phone_pattern = r'(?m)^    var phone by remember \{ mutableStateOf\(initialStudent\?\.phone \?: ""\) \}$'
          phone_match = re.search(phone_pattern, text)
          if not phone_match:
              raise SystemExit('Phone state declaration not found')
          insert_at = phone_match.end()
          text = text[:insert_at] + '\n\n' + launcher + text[insert_at:]

          path.write_text(text, encoding='utf-8')
          print('Contact picker launcher moved below phone state declaration.')
          PY

      - name: Commit source fix and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER_modularized.kt
          git commit -m 'Fix contact picker phone state scope'
          git push origin refactor/student-card-v47

          git rm -f .github/workflows/run-contact-picker-fix.yml .github/workflows/fix-contact-picker-build.yml .github/workflows/fix-contact-picker-scope.yml .github/contact-fix-trigger.txt .github/contact-fix-trigger-2.txt 2>/dev/null || true
          git commit -m 'Remove temporary contact picker workflows' || true
          git push origin refactor/student-card-v47 || true
