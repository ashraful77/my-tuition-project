name: Prepare fixes and Ideas 11-13 upgrade
on:
  push:
    branches: [ideas-1-10-final]
permissions:
  contents: write
jobs:
  upgrade:
    if: github.event.head_commit.message != 'Apply fixes and Ideas 11-13'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ideas-1-10-final
          fetch-depth: 1
      - name: Apply Kotlin source upgrade
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase20_v30_APP_LOGO.kt')
          if not p.exists():
              raise SystemExit('Current MainActivity source not found')
          s=p.read_text()
          # The branch may contain the stable v30 source. Upgrade it only if v31 is absent.
          # Additive changes are intentionally guarded by exact anchors.
          # 1) Student card: hide non-active students from home; use neutral cards in dark mode; show status.
          old='''    val visibleStudents = students.filter {\n        it.name.contains(search, true) || it.className.contains(search, true) || it.batch.contains(search, true) || it.phone.contains(search, true)\n    }.filter { selectedBatch == "All" || it.batch == selectedBatch }'''
          new='''    val visibleStudents = students.filter { it.status.equals("Active", true) }.filter {\n        it.name.contains(search, true) || it.className.contains(search, true) || it.batch.contains(search, true) || it.phone.contains(search, true)\n    }.filter { selectedBatch == "All" || it.batch == selectedBatch }'''
          if old in s: s=s.replace(old,new,1)
          old='''                    val cardContainer = when {\n                        student.status.equals("Paused", true) -> MaterialTheme.colorScheme.surfaceVariant\n                        student.status.equals("Left", true) -> MaterialTheme.colorScheme.surfaceVariant\n                        monthsDue >= 2 -> androidx.compose.ui.graphics.Color(0xFFFFCDD2)\n                        monthsDue == 1 -> androidx.compose.ui.graphics.Color(0xFFFFF3CD)\n                        else -> androidx.compose.ui.graphics.Color(0xFFE8F5E9)\n                    }\n                    Card(colors=CardDefaults.cardColors(containerColor=cardContainer), onClick = { selectedStudent = student }, modifier = Modifier.fillMaxWidth()) {'''
          new='''                    val cardContainer = if (darkTheme) MaterialTheme.colorScheme.surfaceVariant else when {\n                        monthsDue >= 2 -> androidx.compose.ui.graphics.Color(0xFFFFCDD2)\n                        monthsDue == 1 -> androidx.compose.ui.graphics.Color(0xFFFFF3CD)\n                        else -> androidx.compose.ui.graphics.Color(0xFFE8F5E9)\n                    }\n                    Card(colors=CardDefaults.cardColors(containerColor=cardContainer), onClick = { selectedStudent = student }, modifier = Modifier.fillMaxWidth()) {'''
          if old in s: s=s.replace(old,new,1)
          old='''                                    Text(\n                                        "Class ${student.className}  •  Batch ${student.batch}",\n                                        style = MaterialTheme.typography.bodyMedium\n                                    )'''
          new='''                                    Text(\n                                        "Class ${student.className}  •  Batch ${student.batch}",\n                                        style = MaterialTheme.typography.bodyMedium\n                                    )\n                                    Text(\n                                        "Status: ${student.status}",\n                                        style = MaterialTheme.typography.labelMedium,\n                                        fontWeight = FontWeight.SemiBold\n                                    )'''
          if old in s: s=s.replace(old,new,1)
          # 2) Batch model with address and persistent batch list.
          old='''data class BatchRoutine(\n    val id: Long, val batch: String, val day: String, val start: String, val end: String\n)'''
          new='''data class TuitionBatch(\n    val id: Long,\n    val name: String,\n    val address: String = ""\n)\n\ndata class BatchRoutine(\n    val id: Long, val batch: String, val day: String, val start: String, val end: String\n)'''
          if old in s: s=s.replace(old,new,1)
          old='''    fun loadBatchRoutines(): List<BatchRoutine> {'''
          new='''    fun loadBatches(): List<TuitionBatch> {\n        val a = JSONArray(prefs.getString("tuitionBatches", "[]"))\n        return List(a.length()) { i -> val o=a.getJSONObject(i); TuitionBatch(o.getLong("id"),o.optString("name"),o.optString("address")) }\n    }\n    fun saveBatches(list: List<TuitionBatch>) {\n        val a=JSONArray(); list.forEach { b -> a.put(JSONObject().apply { put("id",b.id);put("name",b.name);put("address",b.address) }) }; prefs.edit().putString("tuitionBatches",a.toString()).apply()\n    }\n\n    fun loadBatchRoutines(): List<BatchRoutine> {'''
          if old in s: s=s.replace(old,new,1)
          # 3) Main state + Settings batch management.
          old='''    var routines by remember { mutableStateOf(store.loadBatchRoutines()) }\n    var batchNotes by remember { mutableStateOf(store.loadBatchNotes()) }'''
          new='''    var batchesData by remember { mutableStateOf(store.loadBatches()) }\n    var routines by remember { mutableStateOf(store.loadBatchRoutines()) }\n    var batchNotes by remember { mutableStateOf(store.loadBatchNotes()) }\n    var batchManagerOpen by remember { mutableStateOf(false) }'''
          if old in s: s=s.replace(old,new,1)
          old='''    var securityControlsOpen by remember { mutableStateOf(false) }'''
          new='''    var securityControlsOpen by remember { mutableStateOf(false) }'''
          # Settings callback
          old='''    onSecurityControls: () -> Unit\n) {'''
          new='''    onSecurityControls: () -> Unit,\n    onBatches: () -> Unit\n) {'''
          if old in s: s=s.replace(old,new,1)
          old='''                SettingsButton("🛡️  Protected Actions", onSecurityControls)'''
          new='''                SettingsButton("🛡️  Protected Actions", onSecurityControls)\n                SettingsButton("🏫  Batches & Routine", onBatches)'''
          if old in s: s=s.replace(old,new,1)
          old='''            onSecurityControls = { settingsOpen = false; securityControlsOpen = true },'''
          new='''            onSecurityControls = { settingsOpen = false; securityControlsOpen = true },\n            onBatches = { settingsOpen = false; batchManagerOpen = true },'''
          if old in s: s=s.replace(old,new,1)
          # Add batch dialog before theme dialog rendering.
          old='''        if (themeOpen) ThemeDialog(themeMode, accentName, { themeOpen=false }, { m,a -> themeMode=m; accentName=a; store.saveTheme(m,a) })'''
          new='''        if (batchManagerOpen) BatchManagerDialog(\n            batches = batchesData, routines = routines,\n            onDismiss = { batchManagerOpen = false },\n            onSaveBatches = { batchesData = it; store.saveBatches(it) },\n            onSaveRoutines = { routines = it; store.saveBatchRoutines(it) }\n        )\n        if (themeOpen) ThemeDialog(themeMode, accentName, { themeOpen=false }, { m,a -> themeMode=m; accentName=a; store.saveTheme(m,a) })'''
          if old in s: s=s.replace(old,new,1)
          # Student editor: pass batches and use dropdown instead of free text.
          s=s.replace('StudentEditorDialog("Add Student", null, { addOpen = false })', 'StudentEditorDialog("Add Student", null, { addOpen = false }, batchesData)', 1)
          s=s.replace('StudentEditorDialog("Edit Student", s, { editStudent = null })', 'StudentEditorDialog("Edit Student", s, { editStudent = null }, batchesData)', 1)
          old='''    onSave: (Student) -> Unit\n) {'''
          new='''    onSave: (Student) -> Unit,\n    availableBatches: List<TuitionBatch> = emptyList()\n) {'''
          if old in s: s=s.replace(old,new,1)
          old='''    var batch by remember { mutableStateOf(initialStudent?.batch ?: "") }'''
          new='''    var batch by remember { mutableStateOf(initialStudent?.batch ?: availableBatches.firstOrNull()?.name ?: "") }\n    var batchMenu by remember { mutableStateOf(false) }'''
          if old in s:s=s.replace(old,new,1)
          old='''                OutlinedTextField(\n                    batch, { batch = it }, label = { Text("Batch") },\n                    singleLine = true, modifier = Modifier.fillMaxWidth()\n                )'''
          new='''                if (availableBatches.isNotEmpty()) {\n                    Box(Modifier.fillMaxWidth()) {\n                        OutlinedButton(onClick={ batchMenu=true }, modifier=Modifier.fillMaxWidth()) { Text(if(batch.isBlank()) "Select Batch" else "Batch: $batch") }\n                        DropdownMenu(batchMenu,{batchMenu=false}) { availableBatches.sortedBy{it.name.lowercase()}.forEach { b -> DropdownMenuItem(text={Text(b.name)},onClick={batch=b.name;batchMenu=false}) } }\n                    }\n                } else {\n                    OutlinedTextField(batch,{batch=it},label={Text("Batch")},singleLine=true,modifier=Modifier.fillMaxWidth())\n                }'''
          if old in s:s=s.replace(old,new,1)
          # 4) Manage students grouped by status.
          old='''                if (students.isEmpty()) Text("No students available.")\n                students.sortedBy { it.name.lowercase() }.forEach { s ->'''
          new='''                if (students.isEmpty()) Text("No students available.")\n                listOf("Active", "Paused", "Left").forEach { section ->\n                    val group = students.filter { it.status.equals(section,true) }.sortedBy { it.name.lowercase() }\n                    if (group.isNotEmpty()) {\n                        Text("$section Students (${group.size})", fontWeight=FontWeight.Bold)\n                        group.forEach { s ->'''
          if old in s:s=s.replace(old,new,1)
          old='''                    }\n                }\n            }\n        },\n        confirmButton = { TextButton(onClick = onDismiss) { Text("Close") } }'''
          new='''                        }\n                    }\n                }\n            }\n        },\n        confirmButton = { TextButton(onClick = onDismiss) { Text("Close") } }'''
          # only first occurrence after ManageStudents may be risky; use targeted slice.
          # 5) Receipt history search.
          old='''    var selectedReceipt by remember { mutableStateOf<List<Payment>?>(null) }\n    var selectedStudent by remember { mutableStateOf<Student?>(null) }'''
          new='''    var selectedReceipt by remember { mutableStateOf<List<Payment>?>(null) }\n    var selectedStudent by remember { mutableStateOf<Student?>(null) }\n    var receiptSearch by remember { mutableStateOf("") }'''
          if old in s:s=s.replace(old,new,1)
          old='''    val receiptGroups = payments\n        .filter { it.receiptNo.isNotBlank() }\n        .groupBy { it.receiptNo }\n        .values\n        .sortedByDescending { it.firstOrNull()?.date.orEmpty() }'''
          new='''    val receiptGroups = payments\n        .filter { it.receiptNo.isNotBlank() }\n        .groupBy { it.receiptNo }\n        .values\n        .filter { group ->\n            val r = group.firstOrNull()\n            val studentName = r?.let { studentMap[it.studentId]?.name }.orEmpty()\n            receiptSearch.isBlank() || r?.receiptNo?.contains(receiptSearch,true) == true || studentName.contains(receiptSearch,true)\n        }\n        .sortedByDescending { it.firstOrNull()?.date.orEmpty() }'''
          if old in s:s=s.replace(old,new,1)
          old='''                Text(\n                    "Open or share any previous receipt.",\n                    style = MaterialTheme.typography.bodySmall\n                )'''
          new='''                OutlinedTextField(\n                    value=receiptSearch, onValueChange={receiptSearch=it},\n                    label={Text("Search receipt no. or student name")}, singleLine=true,\n                    trailingIcon={if(receiptSearch.isNotBlank()) TextButton(onClick={receiptSearch=""}){Text("Clear")}},\n                    modifier=Modifier.fillMaxWidth()\n                )\n                Text(\n                    "Open or share any previous receipt.",\n                    style = MaterialTheme.typography.bodySmall\n                )'''
          if old in s:s=s.replace(old,new,1)
          # 6) Add a robust PDF test report helper if not already present; existing createProgressPdf is retained.
          # 7) Format routine display as 12-hour AM/PM in UI and use minutes for auto matching.
          old='''    val dayNow=SimpleDateFormat("EEEE",Locale.getDefault()).format(Date()); val timeNow=SimpleDateFormat("HH:mm",Locale.getDefault()).format(Date()); val auto=routines.firstOrNull{it.day.equals(dayNow,true) && timeNow >= it.start && timeNow <= it.end}?.batch;'''
          new='''    val dayNow=SimpleDateFormat("EEEE",Locale.getDefault()).format(Date()); val timeNow=SimpleDateFormat("HH:mm",Locale.getDefault()).format(Date()); val auto=routines.firstOrNull{it.day.equals(dayNow,true) && routineTimeToMinutes(timeNow) in routineTimeToMinutes(it.start)..routineTimeToMinutes(it.end)}?.batch;'''
          if old in s:s=s.replace(old,new,1)
          # Add helper before LiveBatchDialog.
          marker='''@Composable\nfun LiveBatchDialog('''
          helper='''fun routineTimeToMinutes(value: String): Int {\n    val v=value.trim().uppercase(Locale.getDefault())\n    return try {\n        if (v.endsWith("AM") || v.endsWith("PM")) {\n            val t=v.removeSuffix("AM").removeSuffix("PM").trim()\n            val p=t.split(":"); var h=p[0].toInt(); val m=p.getOrNull(1)?.toIntOrNull() ?: 0\n            if (v.endsWith("PM") && h < 12) h += 12\n            if (v.endsWith("AM") && h == 12) h = 0\n            h*60+m\n        } else { val p=v.split(":"); p[0].toInt()*60+(p.getOrNull(1)?.toIntOrNull()?:0) }\n    } catch (_: Exception) { 0 }\n}\n\nfun formatRoutineTime(value: String): String {\n    val minutes=routineTimeToMinutes(value); val h24=(minutes/60)%24; val m=minutes%60; val ap=if(h24<12)"AM" else "PM"; val h=when(h24%12){0->12;else->h24%12}; return String.format(Locale.ENGLISH,"%d:%02d %s",h,m,ap)\n}\n\n@Composable\nfun LiveBatchDialog('''
          if marker in s and 'fun routineTimeToMinutes' not in s:s=s.replace(marker,helper,1)
          # Display routine times in Today/Live dialogs.
          s=s.replace('Text("🟢 ${it.start}–${it.end} • ${it.batch}")','Text("🟢 ${formatRoutineTime(it.start)}–${formatRoutineTime(it.end)} • ${it.batch}")')
          s=s.replace('Text("${it.day} • ${it.start}–${it.end}")','Text("${it.day} • ${formatRoutineTime(it.start)}–${formatRoutineTime(it.end)}")')
          # If the source is already v31, just apply the above changes. If not, fail visibly rather than damaging it.
          p.write_text(s)
          print('Source upgrade applied')
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase20_v30_APP_LOGO.kt
          git diff --cached --quiet && exit 0
          git commit -m "Apply fixes and Ideas 11-13"
          git push origin HEAD:ideas-1-10-final
