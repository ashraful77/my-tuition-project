name: Fix navigation stay
on:
  push:
    branches: [refactor/student-card-v47]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix navigation stay'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/student-card-v47
          fetch-depth: 1
      - name: Remove forced Home navigation
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER_modularized.kt')
          s = p.read_text()
          replacements = {
              'onDismiss = { selectedBottomTab = 0 },\n            onAdd = { selectedBottomTab = 0; guarded("addStudent", "Add Student") { addOpen = true } },': 'onDismiss = { },\n            onAdd = { selectedBottomTab = 0; guarded("addStudent", "Add Student") { addOpen = true } },',
              'onAttendance = { selectedBottomTab = 0; guarded("attendance", "Attendance") { attendanceOpen = true } },': 'onAttendance = { guarded("attendance", "Attendance") { attendanceOpen = true } },',
              'onAcademic = { selectedBottomTab = 0; guarded("academic", "Academic Records") { academicOpen = true } },': 'onAcademic = { guarded("academic", "Academic Records") { academicOpen = true } },',
              'onReports = { selectedBottomTab = 0; reportOpen = true },': 'onReports = { reportOpen = true },',
              'onTuitionProfile = { selectedBottomTab = 0; guarded("profile", "Tuition Profile") { tuitionProfileOpen = true } },': 'onTuitionProfile = { guarded("profile", "Tuition Profile") { tuitionProfileOpen = true } },',
              'onDemoTools = { selectedBottomTab = 0; guarded("demo", "Demo / Test Data") { demoToolsOpen = true } },': 'onDemoTools = { guarded("demo", "Demo / Test Data") { demoToolsOpen = true } },',
              'onSecurityPin = { selectedBottomTab = 0; requireSecurityPin("Change Security PIN") { changePinOpen = true } },': 'onSecurityPin = { requireSecurityPin("Change Security PIN") { changePinOpen = true } },',
              'onTheme = { selectedBottomTab = 0; themeOpen = true },': 'onTheme = { themeOpen = true },',
              'onSecurityControls = { selectedBottomTab = 0; securityControlsOpen = true },': 'onSecurityControls = { securityControlsOpen = true },',
              'onBatches = { selectedBottomTab = 0; batchManagerOpen = true },': 'onBatches = { batchManagerOpen = true },',
              'onLibrary = { selectedBottomTab = 0; libraryOpen = true },': 'onLibrary = { libraryOpen = true },',
              'onDismiss = { selectedBottomTab = 0 },\n            onOpenProfile = { s -> selectedBottomTab = 0; selectedStudent = s },': 'onDismiss = { },\n            onOpenProfile = { s -> selectedStudent = s },',
              'onCollect = { s -> guarded("payment", "Make Payment") { selectedBottomTab = 0; collectStudent = s } },': 'onCollect = { s -> guarded("payment", "Make Payment") { collectStudent = s } },',
              'onEdit = { s -> guarded("editStudent", "Edit Student") { selectedBottomTab = 0; editStudent = s } },': 'onEdit = { s -> guarded("editStudent", "Edit Student") { editStudent = s } },',
              'onDismiss = { selectedBottomTab = 0 },\n                onEditPayment = { payment -> guarded("editPayment", "Edit Payment")': 'onDismiss = { },\n                onEditPayment = { payment -> guarded("editPayment", "Edit Payment")',
              'if (selectedBottomTab == 2) LiveBatchDialog(routines, batchNotes, { selectedBottomTab=0 },': 'if (selectedBottomTab == 2) LiveBatchDialog(routines, batchNotes, { },',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected text: {old[:100]!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          print('Navigation fix applied.')
      - name: Verify no unwanted resets remain
        shell: python
        run: |
          from pathlib import Path
          s = Path('app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER_modularized.kt').read_text()
          bad = [line for line in s.splitlines() if 'selectedBottomTab = 0' in line]
          print('\n'.join(bad) if bad else 'No selectedBottomTab = 0 resets remain.')
      - name: Commit and clean up
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER_modularized.kt
          git rm .github/workflows/fix-navigation-stay.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix navigation stay"
          git push origin HEAD:refactor/student-card-v47
