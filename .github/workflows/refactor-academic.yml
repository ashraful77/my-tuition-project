name: Refactor Academic Records

on:
  push:
    branches:
      - refactor/student-card-v47

permissions:
  contents: write

jobs:
  extract-academic:
    if: ${{ !contains(github.event.head_commit.message, 'Refactor: extract AcademicRecords feature') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Academic Records feature
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER_modularized.kt')
          out = Path('app/src/main/java/com/themathguild/mytuitionmanager/academic/AcademicRecordsDialog.kt')

          text = src.read_text(encoding='utf-8')
          start_token = 'fun shareAcademicResultWhatsApp('
          end_token = '\n@Composable\nfun SettingsDialog('

          start_pos = text.find(start_token)
          if start_pos < 0:
              raise SystemExit('Academic start marker not found')
          start = text.rfind('\n', 0, start_pos) + 1

          end = text.find(end_token, start_pos)
          if end < 0:
              raise SystemExit('Academic end marker not found')

          block = text[start:end].rstrip() + '\n'
          if 'fun AcademicRecordsDialog(' not in block:
              raise SystemExit('AcademicRecordsDialog was not captured')
          if 'fun createAcademicProgressPdf(' not in block:
              raise SystemExit('createAcademicProgressPdf was not captured')
          if 'fun shareAcademicResultWhatsApp(' not in block:
              raise SystemExit('shareAcademicResultWhatsApp was not captured')

          header = '''package com.themathguild.mytuitionmanager.academic

          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.pdf.PdfDocument
          import android.net.Uri
          import android.widget.Toast
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.KeyboardOptions
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.unit.dp
          import androidx.core.content.FileProvider
          import com.themathguild.mytuitionmanager.AcademicRecord
          import com.themathguild.mytuitionmanager.Student
          import com.themathguild.mytuitionmanager.TuitionProfile
          import com.themathguild.mytuitionmanager.currentDate
          import com.themathguild.mytuitionmanager.receipts.shareReceipt
          import java.io.File
          import java.util.Locale
          import kotlin.math.roundToInt

          '''
          header = '\n'.join(line[10:] if line.startswith('          ') else line for line in header.splitlines()) + '\n'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(header + block, encoding='utf-8')

          updated = text[:start] + text[end:]
          import_line = 'import com.themathguild.mytuitionmanager.academic.AcademicRecordsDialog'
          if import_line not in updated:
              anchor = 'import com.themathguild.mytuitionmanager.attendance.AttendanceDialog\n'
              if anchor not in updated:
                  raise SystemExit('Attendance import anchor not found')
              updated = updated.replace(anchor, anchor + import_line + '\n', 1)

          src.write_text(updated, encoding='utf-8')

          # Structural safety checks: the feature exists only in the new file,
          # while the call site remains in MainActivity.
          main = src.read_text(encoding='utf-8')
          academic = out.read_text(encoding='utf-8')
          if 'fun AcademicRecordsDialog(' in main:
              raise SystemExit('AcademicRecordsDialog still exists in MainActivity')
          if 'fun createAcademicProgressPdf(' in main:
              raise SystemExit('createAcademicProgressPdf still exists in MainActivity')
          if 'fun shareAcademicResultWhatsApp(' in main:
              raise SystemExit('shareAcademicResultWhatsApp still exists in MainActivity')
          if 'import com.themathguild.mytuitionmanager.academic.AcademicRecordsDialog' not in main:
              raise SystemExit('AcademicRecordsDialog import missing from MainActivity')
          if 'fun AcademicRecordsDialog(' not in academic:
              raise SystemExit('AcademicRecordsDialog missing from new file')

          print('Academic extraction completed successfully.')
          print(f'MainActivity: {len(main.splitlines())} lines')
          print(f'AcademicRecordsDialog.kt: {len(academic.splitlines())} lines')
          PY

      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER_modularized.kt app/src/main/java/com/themathguild/mytuitionmanager/academic/AcademicRecordsDialog.kt
          git commit -m "Refactor: extract AcademicRecords feature"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/refactor-academic.yml
          git commit -m "chore: remove temporary academic refactor workflow"
          git push origin HEAD:${GITHUB_REF_NAME}
