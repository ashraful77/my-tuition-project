name: Add Contact Phone Picker

on:
  push:
    branches:
      - refactor/student-card-v47

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'ashraful77'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch Add Student phone field
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER_modularized.kt')
          text = path.read_text(encoding='utf-8')
          needle = '''fun StudentEditorDialog(\n    title: String,\n    initialStudent: Student?,\n    batches: List<Batch> = emptyList(),\n    onDismiss: () -> Unit,\n    onSave: (Student) -> Unit\n) {\n    val standardClasses = listOf("V", "VI", "VII", "VIII", "IX", "X")'''
          replacement = '''fun StudentEditorDialog(\n    title: String,\n    initialStudent: Student?,\n    batches: List<Batch> = emptyList(),\n    onDismiss: () -> Unit,\n    onSave: (Student) -> Unit\n) {\n    val context = LocalContext.current\n    val phonePickerLauncher = androidx.activity.compose.rememberLauncherForActivityResult(\n        contract = ActivityResultContracts.StartActivityForResult()\n    ) { result ->\n        if (result.resultCode == android.app.Activity.RESULT_OK) {\n            val uri = result.data?.data\n            if (uri != null) {\n                context.contentResolver.query(\n                    uri,\n                    arrayOf(android.provider.ContactsContract.CommonDataKinds.Phone.NUMBER),\n                    null,\n                    null,\n                    null\n                )?.use { cursor ->\n                    if (cursor.moveToFirst()) {\n                        val numberIndex = cursor.getColumnIndex(android.provider.ContactsContract.CommonDataKinds.Phone.NUMBER)\n                        if (numberIndex >= 0) phone = cursor.getString(numberIndex) ?: ""\n                    }\n                }\n            }\n        }\n    }\n\n    val standardClasses = listOf("V", "VI", "VII", "VIII", "IX", "X")'''
          if needle not in text:
              raise SystemExit('StudentEditorDialog anchor not found')
          text = text.replace(needle, replacement, 1)
          old = '''                OutlinedTextField(\n                    phone, { phone = it }, label = { Text("Phone") },\n                    keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Phone),\n                    singleLine = true, modifier = Modifier.fillMaxWidth()\n                )'''
          new = '''                OutlinedTextField(\n                    phone, { phone = it }, label = { Text("Phone") },\n                    keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Phone),\n                    singleLine = true, modifier = Modifier.fillMaxWidth()\n                )\n                OutlinedButton(\n                    onClick = {\n                        phonePickerLauncher.launch(\n                            Intent(\n                                Intent.ACTION_PICK,\n                                android.provider.ContactsContract.CommonDataKinds.Phone.CONTENT_URI\n                            )\n                        )\n                    },\n                    modifier = Modifier.fillMaxWidth()\n                ) {\n                    Text("Pick phone number from Contacts")\n                }'''
          if old not in text:
              raise SystemExit('Phone field anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER_modularized.kt
          git rm .github/workflows/add-contact-picker.yml
          git commit -m 'Add contact picker to student phone field'
          git push
