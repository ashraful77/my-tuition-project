name: Apply Students Phase 1
on:
  push:
    branches:
      - refactor/student-card-v47
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply source patch
        run: python3 scripts/apply_students_phase1.py
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Commit source and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase35_v46_STUDENT_SEARCH_FILTER_modularized.kt app/src/main/java/com/themathguild/mytuitionmanager/components/StudentCard.kt
          git commit -m "Redesign Students tab Phase 1"
          git rm .github/workflows/apply-students-phase1.yml .github/workflows/verify-navigation-build.yml scripts/apply_students_phase1.py
          git commit -m "Remove temporary Students patch files"
          git push
