name: Fix duplicate security callback
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix duplicate security callback'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Remove duplicate callback
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase20_v30_APP_LOGO.kt')
          s = p.read_text()
          duplicate = '            onRestore = { requireSecurityPin("Restore Backup") { restoreConfirmOpen = true } },\n            onSecurityPin = { settingsOpen = false; requireSecurityPin("Change Security PIN") { changePinOpen = true } }\n        )'
          replacement = '            onRestore = { requireSecurityPin("Restore Backup") { restoreConfirmOpen = true } }\n        )'
          if s.count('            onSecurityPin = { settingsOpen = false; requireSecurityPin("Change Security PIN") { changePinOpen = true } }') > 1:
              s = s.replace(duplicate, replacement, 1)
              p.write_text(s)
              print('Removed duplicate onSecurityPin callback.')
          else:
              print('No duplicate callback found.')
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/themathguild/mytuitionmanager/MainActivity_Phase20_v30_APP_LOGO.kt
          git diff --cached --quiet && exit 0
          git commit -m "Fix duplicate security callback"
          git push origin HEAD:main
